application:
  name: "workshop-management"
  pods:
    - name: "frontend"
      image: "us-east1-docker.pkg.dev/capture-by-auditdeploy/nexlayer-mcp/workshop-management-5c3574be-frontend:61d21a7a-1757799296"
      path: "/"
      servicePorts: [3000]
      vars:
        NODE_ENV: "production"
        NEXT_PUBLIC_API_URL: "http://backend.pod:3003"
        NEXT_PUBLIC_SITE_URL: "<% URL %>"
    - name: "backend"
      image: "us-east1-docker.pkg.dev/capture-by-auditdeploy/nexlayer-mcp/workshop-management-5c3574be-backend:fa00201b-1757799427"
      servicePorts: [3003]
      vars:
        NODE_ENV: "production"
        DB_HOST: "database.pod"
        DB_USER: "root"
        DB_PASSWORD: "password"
        DB_NAME: "WorkshopManagement"
        DB_PORT: "3306"
    - name: "database"
      image: "mysql:8.0"
      servicePorts: [3306]
      vars:
        MYSQL_ROOT_PASSWORD: "password"
        MYSQL_DATABASE: "WorkshopManagement"
        MYSQL_USER: "workshop_user"
        MYSQL_PASSWORD: "workshop_password"
      volumes:
        - name: "mysql-data"
          size: "1Gi"
          mountPath: "/var/lib/mysql"
