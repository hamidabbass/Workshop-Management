application:
  name: "workshop-management"
  pods:
    - name: "frontend"
      image: "registry.nexlayer.io/workshop-management-frontend:latest"
      path: "/"
      servicePorts: [3000]
      vars:
        NODE_ENV: "production"
        NEXT_PUBLIC_API_URL: "<% URL %>/api"
        NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDUB1f5_oplWDbKcvpWzMR08vF7ZAnlfbc"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "workshop-management-9ce72.firebaseapp.com"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "workshop-management-9ce72"
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "workshop-management-9ce72.appspot.com"
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "216098985932"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:216098985932:web:000b401dfa2860f7d02f69"

    - name: "backend"
      image: "registry.nexlayer.io/workshop-management-backend:latest"
      path: "/api"
      servicePorts: [3003]
      vars:
        NODE_ENV: "production"
        DB_HOST: "database.pod"
        DB_USER: "root"
        DB_PASSWORD: "workshop_password"
        DB_NAME: "WorkshopManagement"
        DB_PORT: "3306"

    - name: "database"
      image: "registry.nexlayer.io/workshop-management-database:latest"
      servicePorts: [3306]
      vars:
        MYSQL_ROOT_PASSWORD: "workshop_password"
        MYSQL_DATABASE: "WorkshopManagement"
      volumes:
        - name: "mysql-data"
          size: "5Gi"
          mountPath: "/var/lib/mysql"
